<header><h1>Maths question bank</h1>

<section id="browse"></section><section id="curriculum" hidden></section><section id="add" hidden></section><section id="mine" hidden></section>

<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>

<script>

async function call(path,body){
  const h={'X-Bank':'1'};const t=store.get('bankToken');if(t)h['X-Token']=t;const n=store.get('bankName');if(n)h['X-Teacher']=n;
  const r=await fetch('/bank/api/'+path,body?{method:'POST',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify(body)}:{headers:h});
  const j=await r.json().catch(()=>({error:'The server did not answer.'}));if(!r.ok)throw new Error(j.error||r.statusText);return j}
const isEd=()=>!!(me&&me.name),isAdmin=()=>isEd()&&me.role==='admin';
function drawAcct(){const a=$('#acct');a.textContent='';
  if(isEd()){a.append(el('span',{class:'who'},`${me.name} (${me.role}) `),el('button',{onclick:()=>{store.del('bankToken');me=null;start()}},'Log out'))}
  else{const u=el('input',{placeholder:'Editor user name',size:12}),p=el('input',{type:'password',placeholder:'Password',size:12}),n=el('input',{placeholder:'Your name (to suggest)',size:16,value:store.get('bankName')}),m=el('span',{class:'err'});
    n.onchange=()=>store.setL('bankName',n.value.trim());

function tabList(){const t={browse:'Browse the bank',add:isEd()?'Add a question':'Suggest a question'};

function show(name){const t=tabList();for(const k of['browse','add','curriculum','mine','changes','people'])$('#'+k).hidden=k!==name;
  [...$('#tabs').children].forEach(b=>b.classList.toggle('on',b.dataset.t===name));
  if(name==='curriculum')drawCurriculum();if(name==='mine')drawMine();if(name==='changes')drawChanges();if(name==='people')drawPeople()}
function drawTabs(){const t=tabList();$('#tabs').textContent='';for(const k in t)$('#tabs').append(el('button',{'data-t':k,onclick:()=>show(k)},t[k]))}
async function loadDb(){db=await call('items')}
function qbox(q,extra){return el('div',{class:'q'},el('div',{class:'meta'},el('span',{class:'tag'},q.year||''),el('span',{class:'tag'},LEVELS[q.level||q.difficulty]||''),q.topic||'',' · ',q.skill||q.subtopic||''),el('div',{},q.q||q.text),el('div',{class:'ans'},'Answer: '+(q.a||q.answer)),extra||'')}
function strandOf(cat){return taxonomy.find(t=>t.skills.some(k=>k.id===cat))}
function form(init={}){const f={};const mk=(n,l,e)=>{f[n]=e;return[el('label',{},l),e]};const root=el('div');
  const strand=el('select',{},el('option',{value:''},'Choose a strand…'),...taxonomy.map(t=>el('option',{value:t.id},t.name)));

  const fillSkills=()=>{const t=taxonomy.find(x=>x.id===strand.value);skill.textContent='';skill.append(el('option',{value:''},t?'Choose a skill…':'Choose a strand first'),...(t?t.skills.map(k=>el('option',{value:k.id},`${k.id} · ${k.name}`)):[]))};
  strand.onchange=fillSkills;fillSkills();
  root.append(...mk('text','Question (equations between $ signs, e.g. $\\frac{3}{4}+\\frac{1}{8}$)',el('textarea')),
   ...mk('answer','Answer',el('input',{size:40})),
   el('label',{},'Strand'),strand,el('label',{},'Skill (where it lives in the bank)'),skill,
   ...mk('year','Year group',el('select',{},...['Y7','Y8','Y9','Y10','Y11'].map(t=>el('option',{},t)))),
   ...mk('difficulty','Level',el('select',{},...[1,2,3,4].map(i=>el('option',{value:i},i+' · '+LEVELS[i])))),
   ...mk('keywords','Search words, separated by commas',el('input',{size:40})));
  const fill=o=>{for(const[k,v]of Object.entries(o)){if(k==='category'&&v){const st=strandOf(v);if(st){strand.value=st.id;fillSkills();skill.value=v}}else if(f[k]&&v!=null)f[k].value=Array.isArray(v)?v.join(', '):v}};fill(init);
  return{el:root,get:()=>Object.fromEntries(Object.entries(f).map(([k,e])=>[k,e.value])),fill}}
const sameSkill=c=>c.skill;
function builtinState(c){return db.retired.includes(c.id)?'retired':db.replaced[c.id]?'replaced':''}
let strandSel='';
const catOf=c=>c.built?(db.recat[c.id]||c.cat):c.cat;
function allItems(){const items=catalog.map(c=>({...c,built:true}));
  for(const[id,q]of Object.entries(db.added||{}))items.push({id,year:q.year,level:q.difficulty,topic:q.topic,skill:q.subtopic,q:q.text,a:q.answer,cat:q.category||'',staff:true});return items}
const skillName=id=>{for(const t of taxonomy)for(const k of t.skills)if(k.id===id)return`${k.id} · ${k.name}`;return id};
// Every question that shares this one's skill name and place: they move together.
const sameGroup=c=>allItems().filter(x=>x.built===c.built&&x.skill===c.skill&&catOf(x)===catOf(c)).map(x=>x.id);
async function moveTo(ids,cat,after){try{await call('edit/move',{targets:ids,category:cat});await loadDb();flash(`Moved ${ids.length} question${ids.length>1?'s':''} to ${skillName(cat)}`);after()}catch(e){alert(e.message)}}
function flash(t){let f=$('#flash');if(!f){f=el('div',{id:'flash',style:'position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#050038;color:#fff;padding:8px 16px;border-radius:99px;z-index:9'});document.body.append(f)}f.textContent=t;f.hidden=false;clearTimeout(f.t);f.t=setTimeout(()=>f.hidden=true,3500)}
function moveBox(c,go){const box=el('div',{class:'hint'});const ed=form({category:catOf(c)});
  const group=sameGroup(c);const all=el('input',{type:'checkbox'});all.checked=group.length>1;

  if(group.length>1)box.append(el('label',{style:'display:flex;gap:6px;align-items:center'},all,`Move all ${group.length} questions called “${c.skill}” together`));
  box.append(el('div',{class:'row'},el('button',{class:'pri',onclick:()=>{const cat=ed.get().category;if(!cat)return alert('Choose a skill first.');moveTo(all.checked?group:[c.id],cat,go)}},'Move'),el('button',{onclick:()=>box.remove()},'Cancel')));

function drawBrowse(){const s=$('#browse');s.textContent='';
  const f={q:el('input',{placeholder:'Search all skills and questions',size:30}),y:el('select',{},el('option',{value:''},'All years'),...['Y7','Y8','Y9','Y10','Y11'].map(y=>el('option',{},y))),
    l:el('select',{},el('option',{value:''},'All levels'),...[1,2,3,4].map(i=>el('option',{value:i},LEVELS[i])))};
  const bar=el('div',{class:'row'},f.q,f.y,f.l),strands=el('div',{class:'row'}),out=el('div'),note=el('div',{class:'meta'});
  const matches=(c,w)=>{const h=(c.skill+' '+c.topic+' '+c.q+' '+c.id).toLowerCase();return w.every(x=>{const st=x.replace(/(ing|ed|es|s)$/,'');return h.includes(x)||(st.length>=3&&h.includes(st))})};

    const w=f.q.value.toLowerCase().split(/\s+/).filter(Boolean);
    const hits=allItems().filter(c=>(!f.y.value||c.year===f.y.value)&&(!f.l.value||String(c.level)===f.l.value)&&matches(c,w)&&!(c.built&&db.retired.includes(c.id)));
    const byCat={};for(const h of hits)(byCat[catOf(h)||'']=byCat[catOf(h)||'']||[]).push(h);
    const groups=[...taxonomy.map(t=>({id:t.id,name:t.name,skills:t.skills.map(k=>({...k,items:byCat[k.id]||[]}))}))];
    const loose=byCat['']||[];if(loose.length)groups.push({id:'_',name:'Not sorted yet',skills:[{id:'',name:'Waiting to be placed in a skill',items:loose}]});
    const total=g=>g.skills.reduce((n,k)=>n+k.items.length,0);
    if(!strandSel||!groups.some(g=>g.id===strandSel))strandSel=groups[0].id;
    if(w.length||f.y.value||f.l.value){const best=groups.find(g=>total(g)>0);if(best&&total(groups.find(g=>g.id===strandSel))===0)strandSel=best.id}
    for(const g of groups){const b=el('button',{class:g.id===strandSel?'on':'',onclick:()=>{strandSel=g.id;go()}},`${g.name} (${total(g)})`);
      if(isEd()){b.ondragover=e=>{e.preventDefault();if(strandSel!==g.id&&!b.t)b.t=setTimeout(()=>{strandSel=g.id;go()},500)};b.ondragleave=()=>{clearTimeout(b.t);b.t=0}}strands.append(b)}
    const g=groups.find(x=>x.id===strandSel);

    for(const k of g.skills){const d=el('details',{class:'q'});if((w.length||f.y.value||f.l.value)&&k.items.length)d.open=true;
      const sum=el('summary',{},el('b',{},k.id?`${k.id} · ${k.name}`:k.name),' ',el('span',{class:'tag'},k.items.length?`${k.items.length} question${k.items.length>1?'s':''}`:'none yet'));
      if(isEd()&&k.id){sum.ondragover=e=>{e.preventDefault();sum.style.outline='2px solid #4353ff'};sum.ondragleave=()=>sum.style.outline='';sum.ondrop=e=>{e.preventDefault();sum.style.outline='';try{const ids=JSON.parse(e.dataTransfer.getData('text/plain'));moveTo(ids,k.id,go)}catch{}}}
      d.append(sum);
      const fillItems=()=>{if(d.dataset.done)return;d.dataset.done=1;if(!k.items.length){d.append(el('div',{class:'meta'},isEd()?'Nothing here yet. Use “Add a question” and choose this skill.':'Nothing here yet. You can suggest a question for this skill.'));return}
        k.items.slice(0,30).forEach(c=>{const st=c.built?builtinState(c):'';
          {const row=qbox(c,el('div',{class:'row',style:'margin:6px 0 0'},st?el('span',{class:'tag'},st==='retired'?'Taken out of the bank':'Replaced by a staff question'):null,c.staff?el('span',{class:'tag'},'Staff question'):null,
            c.built||c.staff?(isEd()?(st?el('button',{onclick:async()=>{await call('edit/restore',{target:c.id});await loadDb();go()}},'Put back'):[el('button',{onclick:(e)=>{const row=e.target.closest('.q');if(!row.querySelector('.hint'))row.append(moveBox(c,go))}},'Move to another skill…'),c.staff?null:el('button',{onclick:()=>editBox(c,true)},'Replace with my version…'),c.staff?null:el('button',{onclick:async()=>{if(confirm('Take this out of the bank? It can be put back.')){await call('edit/retire',{target:c.id});await loadDb();go()}}},'Take out')]):el('button',{onclick:()=>editBox(c,false)},'Something is wrong / suggest an edit')):null));if(isEd()){row.draggable=true;row.style.cursor='grab';row.title='Drag onto another skill to move it (all questions with the same skill name go together)';row.ondragstart=e=>{e.dataTransfer.setData('text/plain',JSON.stringify(sameGroup(c)));e.dataTransfer.effectAllowed='move'}}d.append(row)}});
        if(k.items.length>30)d.append(el('div',{class:'meta'},`${k.items.length-30} more: narrow it with the search, year or level.`));math(d)};
      d.ontoggle=()=>{if(d.open)fillItems()};if(d.open)fillItems();out.append(d)}
    };
  [f.q,f.y,f.l].forEach(e=>e.oninput=go);s.append(bar,strands,note,out);go()}
function editBox(c,direct){const s=$('#browse');const box=el('div',{class:'q'});const msg=el('div');
  const ed=form({text:c.q,answer:c.a,category:c.cat,year:c.year,difficulty:c.level});
  const act=el('select',{},...[['reword','I would reword it'],['wrong','This question is wrong'],['retire','Remove it from the bank'],['retag','Wrong year or level']].map(([v,t])=>el('option',{value:v},t)));
  const note=el('textarea',{placeholder:'What is the problem?'});
  const send=async()=>{try{if(direct)await call('edit/replace',{target:c.id,...ed.get()});else{const a=act.value;await call('suggest/flag',{target:c.id,action:a,note:note.value,question:['reword','retag'].includes(a)?ed.get():undefined})}
    box.textContent=direct?'Saved. It is live in the bank now.':'Thank you, sent for approval.';if(direct)await loadDb()}catch(e){msg.className='err';msg.textContent=e.message}};
  box.append(el('b',{},(direct?'Replace ':'About ')+c.id),el('div',{class:'meta'},direct?'Write the version you want. The built-in one stops being used and yours takes its place; “Put back” undoes it.':c.q),
    direct?null:act,direct?null:note,ed.el,msg,el('button',{class:'pri',onclick:send},direct?'Save':'Send'),el('button',{onclick:()=>box.remove()},'Cancel'));
  s.prepend(box);scrollTo(0,0)}
function drawAdd(existing){const s=$('#add');s.textContent='';const fm=form(existing||{});const msg=el('div');
  const paste=el('textarea',{placeholder:'Paste the Gem\u2019s answer here (JSON), then press Fill the form'});
  s.append(el('div',{class:'hint'},'Quickest way: photograph the question, give it to the school\u2019s Gemini Gem, check it with the Gem, then paste its answer below.'),paste,
    el('button',{onclick:()=>{try{const t=paste.value.replace(/```(json)?/g,'').trim();let o=JSON.parse(t);if(Array.isArray(o))o=o[0];fm.fill(o);msg.className='okmsg';msg.textContent='Filled in. Check each box, then save.'}catch{msg.className='err';msg.textContent='That did not read as the Gem\u2019s JSON answer. You can also type the question in below.'}}},'Fill the form'),
    fm.el,msg,el('button',{class:'pri',onclick:async()=>{try{await call(isEd()?'edit/save':'suggest/new',{...fm.get(),id:existing&&existing.id});msg.className='okmsg';msg.textContent=isEd()?'Saved. It is live in the bank now.':'Sent for approval. Thank you.';if(isEd())await loadDb()}catch(e){msg.className='err';msg.textContent=e.message}}},isEd()?'Save to the bank':'Send for approval'))}
// Curriculum tagging
const objKey=(y,r,u,o)=>`${y}|${r}|${u}|${o}`;
function appSkills(){const m=new Map();for(const c of catalog)if(!m.has(c.key))m.set(c.key,{key:c.key,name:c.skill,year:c.year,cat:catOf(c)});
  for(const q of Object.values(db.added||{})){const key=`${q.topic} · ${q.subtopic}`;if(!m.has(key))m.set(key,{key,name:q.subtopic,year:q.year,cat:q.category||''})}return[...m.values()]}
async function drawCurriculum(){const s=$('#curriculum');s.textContent='';

  if(!curriculum||!curriculum.courses){s.append(el('div',{class:'hint'},'No curriculum has been published to this site yet. Publish one with deploy-private.sh (it comes from the Mac app’s Get Ready curriculum).'));return}
  const courses=curriculum.courses;const years=[...new Set(courses.map(c=>c.year))];
  const sel=(opts,val)=>{const e=el('select',{},...opts.map(o=>el('option',{value:o},o||'(one route)')));e.value=val;return e};
  const st=drawCurriculum.st=drawCurriculum.st||{};st.year=st.year||years[0];
  const routes=[...new Set(courses.filter(c=>c.year===st.year).map(c=>c.route||''))];if(!routes.includes(st.route))st.route=routes[0];
  const course=courses.find(c=>c.year===st.year&&(c.route||'')===st.route)||{units:[]};
  const units=course.units.map(u=>u.title);if(!units.includes(st.unit))st.unit=units[0];
  const unit=course.units.find(u=>u.title===st.unit)||{objectives:[]};

  y.onchange=()=>{st.year=y.value;st.route=st.unit='';drawCurriculum()};r.onchange=()=>{st.route=r.value;st.unit='';drawCurriculum()};u.onchange=()=>{st.unit=u.value;drawCurriculum()};
  const objs=unit.objectives||[];const tagged=objs.filter(o=>(db.tags[objKey(st.year,st.route,st.unit,o.text)]||[]).length).length;
  s.append(el('div',{class:'hint'},'Choose the questions that practise each lesson. Get Ready then uses exactly those for “Last lesson”, “Last week” and so on, instead of guessing from the words.'),
    el('div',{class:'row'},y,r,u),el('div',{class:'meta'},`${tagged} of ${objs.length} objectives in this unit are tagged.`));
  const skills=appSkills();const byKey=new Map(skills.map(k=>[k.key,k]));
  objs.forEach(o=>{const key=objKey(st.year,st.route,st.unit,o.text);const cur=db.tags[key]||[];
    const box=el('div',{class:'q'},el('b',{},o.text),el('div',{class:'meta'},cur.length?'':'Not tagged yet'));

    cur.forEach(k=>{const sk=byKey.get(k);chips.append(el('span',{class:'tag'},sk?`${sk.name} · ${sk.year||'any'}`:k,' ',el('a',{href:'#',title:'Remove',onclick:e=>{e.preventDefault();save(cur.filter(x=>x!==k))}},'×')))});
    const add=el('input',{placeholder:'Type a skill to add, e.g. substitution',size:34}),list=el('div');

       .forEach(k=>list.append(el('button',{style:'display:block;margin:2px 0;text-align:left',onclick:()=>save([...cur,k.key])},`${k.name} · ${k.year||'any year'}  `,el('span',{class:'meta'},skillName(k.cat)))))};
    box.append(chips,add,list);s.append(box)})}
function drawMine(){const s=$('#mine');s.textContent='';
  s.append(el('h3',{},'Staff questions in the live bank'));
  const ids=Object.keys(db.added);if(!ids.length)s.append(el('p',{class:'meta'},'None yet. Use “Add a question”.'));
  ids.forEach(id=>s.append(qbox(db.added[id],el('div',{class:'row',style:'margin:6px 0 0'},el('span',{class:'meta'},id),
    el('button',{onclick:()=>{show('add');drawAdd({...db.added[id],id,keywords:db.added[id].keywords})}},'Edit'),
    el('button',{onclick:async()=>{if(confirm('Delete this question?')){await call('edit/delete',{id});await loadDb();drawMine()}}},'Delete')))));
  s.append(el('h3',{},'Built-in questions you have changed'));
  const ch=[...Object.keys(db.replaced).map(t=>[t,'replaced']),...db.retired.map(t=>[t,'taken out'])];
  if(!ch.length)s.append(el('p',{class:'meta'},'None.'));
  ch.forEach(([t,k])=>s.append(el('div',{class:'q'},`${t}: ${k} `,el('button',{onclick:async()=>{await call('edit/restore',{target:t});await loadDb();drawMine()}},'Put back'))));
  s.append(el('h3',{},'Recent changes'),...db.history.slice().reverse().map(h=>el('div',{class:'meta'},`${h.at} · ${h.by} · ${h.what} ${h.target}`)));math(s)}
function drawChanges(){const s=$('#changes');s.textContent='';const items=db.items.slice().reverse();if(!items.length)s.append('Nothing yet.');
  items.forEach(it=>{const q=it.question;const b=el('div',{class:'q'},el('div',{class:'meta'},`#${it.id} · ${it.by} · ${it.at} · `,el('b',{},it.status)),el('div',{},it.kind==='new'?'New question:':`About ${it.target}: ${it.action}${it.note?' – '+it.note:''}`));
    if(q)b.append(qbox(q));
    if(isEd()&&it.status==='pending')b.append(el('div',{class:'row'},...['approved','rejected'].map(d=>el('button',{class:d==='approved'?'pri':'',onclick:async()=>{await call('review',{id:it.id,decision:d});await loadDb();drawChanges()}},d==='approved'?'Approve (goes live)':'Reject'))));
    s.append(b)});math(s)}
async function drawPeople(){const s=$('#people');s.textContent='';const {users}=await call('users');
  s.append(el('div',{class:'hint'},'Editors can add, change and take out questions in the live bank. Admins can also make and remove logins. Everyone else only suggests.'));
  users.forEach(u=>s.append(el('div',{class:'q'},`${u.name} · ${u.username} · ${u.role} `,el('button',{onclick:async()=>{if(confirm('Remove this login?'))try{await call('users/remove',{username:u.username});drawPeople()}catch(e){alert(e.message)}}},'Remove'))));
  const f={u:el('input',{placeholder:'user name e.g. ksmith'}),n:el('input',{placeholder:'Name'}),r:el('select',{},el('option',{value:'editor'},'editor'),el('option',{value:'admin'},'admin')),p:el('input',{type:'password',placeholder:'Password (8+; blank keeps it)'})};const m=el('div');
  s.append(el('h3',{},'Add or change a login'),el('div',{class:'row'},f.u,f.n,f.r,f.p,el('button',{class:'pri',onclick:async()=>{try{await call('users/save',{username:f.u.value,name:f.n.value,role:f.r.value,password:f.p.value});drawPeople()}catch(e){m.className='err';m.textContent=e.message}}},'Save')),m)}
async function start(){me=null;try{me=await call('me')}catch{}try{await loadDb()}catch{}drawAcct();drawTabs();drawBrowse();drawAdd();show('browse')}
fetch('/bank-catalog.json').then(r=>r.json()).then(c=>{catalog=c.items||[];taxonomy=c.taxonomy||[]}).catch(()=>{}).finally(start);
