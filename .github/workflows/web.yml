name: Publish web app

# Builds DeckCraft's web version and publishes it to GitHub Pages
# (https://k-betts.github.io/deckcraft/). It runs by itself whenever something is merged to main
# (not for Markdown or docs/ changes), and can be started by hand from
# GitHub > Actions > "Publish web app" > Run workflow. It needs Settings > Pages > Source:
# GitHub Actions switched on once. See docs/web-hosting.md.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Same craft-fonts commit as ci.yml (Latin presentation fonts, embedded in the app).
  CRAFT_FONTS_REF: 37827adc41fd165f9a9234ac40f94dbad353aa69
  TRUNK_VERSION: 0.21.14

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out craft-fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: web
      - name: Install trunk
        run: cargo install trunk --version "${TRUNK_VERSION}" --locked
      - name: Check the service worker
        run: node apps/deckcraft-web/tests/sw.test.mjs
      - name: Build
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: cd apps/deckcraft-web && trunk build --release
      - name: Keep GitHub from treating the site as Jekyll
        run: touch dist/web/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
