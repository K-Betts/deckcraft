[package]
name = "deckcraft-drive"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Google Drive for DeckCraft: loopback OAuth with PKCE, drive.file scope, Keychain token storage. Native only; never built for wasm."

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# New dependencies (each listed in the pull request):
# HTTPS client with rustls and no async runtime.
ureq = "3"
# SHA-256 for the PKCE code challenge.
sha2 = "0.10"
# URL-safe base64 for PKCE and base64 of nothing else.
base64 = "0.22"
# Cryptographically random bytes for the PKCE verifier and OAuth state.
getrandom = "0.3"

# The refresh token lives in the system credential store. keyring v3 has NO default store: each
# platform's must be switched on or it silently falls back to a mock that forgets the token.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

# Linux and the BSDs: the kernel keyring. (The desktop Secret Service store needs the system
# libdbus-1-dev package to build, which broke CI and every Linux build for a feature nobody ships there.)
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3", default-features = false, features = ["linux-native"] }
